// Standalone replacement for Claude's built-in artifact storage (localStorage-backed).
function safeGet(key) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? null : { key, value, shared: false };
  } catch (e) {
    return null;
  }
}
window.storage = {
  async get(key) { return safeGet(key); },
  async set(key, value) {
    try { localStorage.setItem(key, value); return { key, value, shared: false }; }
    catch (e) { return null; }
  },
  async delete(key) {
    try { const existed = localStorage.getItem(key) !== null; localStorage.removeItem(key); return { key, deleted: existed, shared: false }; }
    catch (e) { return null; }
  },
  async list(prefix = "") {
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) keys.push(k); }
      return { keys, prefix, shared: false };
    } catch (e) { return null; }
  },
};

function localDateStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function monthKey(dateStr) { return dateStr.slice(0, 7); }
function prettyDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric", weekday: "short" });
}
function computeStatus(devotee, checkIn) {
  if (!checkIn) return { status: "Absent", lateBy: 0 };
  const expected = EXPECTED[devotee.group] || "06:00";
  const [eh, em] = expected.split(":").map(Number);
  const [ch, cm] = checkIn.split(":").map(Number);
  const diff = (ch * 60 + cm) - (eh * 60 + em);
  if (diff > 0) return { status: "Late", lateBy: diff };
  return { status: "On time", lateBy: 0 };
}
function defaultDayRecords(devotees, saved) {
  return devotees.map((d) => {
    const found = saved && saved.find((r) => r.devoteeId === d.id);
    const base = { devoteeId: d.id, checkIn: "", status: "Absent", lateBy: 0, chanting: false, aarti: false, lecture: false, reason: "", chantingReason: "", aartiReason: "", lectureReason: "", mahamantraApplicable: true };
    return found ? { ...base, ...found } : base;
  });
}
// Recompute a devotee's pending balance for a given date's status, idempotently.
function applyLedger(devotee, date, applicable, penaltyType, reason) {
  // penaltyType: "none" | "late" | "absent" | "missed_session"
  const remaining = (devotee.log || []).filter((l) => l.date !== date);
  let pending = remaining.reduce((sum, l) => sum + l.amount, 0);
  const newLog = [...remaining];
  if (penaltyType !== "none") {
    if (!applicable) {
      newLog.push({ date, type: "Exempted", amount: 0, reason: reason || "" });
    } else {
      if (pending > 0) {
        pending += 10;
        newLog.push({ date, type: "Delay surcharge", amount: 10 });
      }
      const base = penaltyType === "absent" ? 108 : 54;
      const label = penaltyType === "absent" ? "Absent" : penaltyType === "missed_session" ? "Missed session" : "Late";
      pending += base;
      newLog.push({ date, type: label, amount: base });
    }
  }
  newLog.sort((a, b) => (a.date < b.date ? 1 : -1));
  return { pending, log: newLog };
}
function missedAnySession(rec) {
  return rec.status !== "Absent" && (!rec.chanting || !rec.aarti || !rec.lecture);
}

async function storageSetWithRetry(key, value, shared, attempts = 3, delayMs = 700) {
  let lastErr = null;
  for (let i = 0; i < attempts; i++) {
    try {
      const r = await window.storage.set(key, value, shared);
      if (r) return r;
      lastErr = new Error("storage returned no result");
    } catch (e) {
      lastErr = e;
    }
    if (i < attempts - 1) await new Promise((res) => setTimeout(res, delayMs * (i + 1)));
  }
  throw lastErr || new Error("storage set failed after retries");
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

function resizeImageToBase64(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL("image/jpeg", quality);
      resolve({ base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("could not load image")); };
    img.src = url;
  });
}

function extractNames(rows) {
  if (!rows || !rows.length) return [];
  let startIdx = 0, colIdx = 0;
  const header = (rows[0] || []).map((c) => String(c || "").trim().toLowerCase());
  const nameColIdx = header.findIndex((h) => h.includes("name"));
  if (nameColIdx !== -1) { colIdx = nameColIdx; startIdx = 1; }
  const names = [];
  for (let i = startIdx; i < rows.length; i++) {
    const val = rows[i] ? rows[i][colIdx] : "";
    const trimmed = val !== undefined && val !== null ? String(val).trim() : "";
    if (trimmed) names.push(trimmed);
  }
  return names;
}

function toCSV(rows) {
  if (!rows.length) return "";
  const headers = Object.keys(rows[0]);
  const esc = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [headers.join(","), ...rows.map((r) => headers.map((h) => esc(r[h])).join(","))].join("\n");
}

function MalaRing({ value, max = 108, size = 48 }) {
  const pct = Math.min(value / max, 1);
  const r = size / 2 - 4;
  const circ = 2 * Math.PI * r;
  const color = value === 0 ? C.tulsi : value < 54 ? C.dawn : C.vermilion;
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.line} strokeWidth="4" />
        <circle
          cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="4"
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round"
          transform={`rotate(-90 ${size / 2} ${size / 2})`}
          style={{ transition: "stroke-dashoffset 0.4s ease" }}
        />
      </svg>
      <div className="font-mono" style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size / 3.4, fontWeight: 600, color: C.ink }}>
        {value}

  );
}
function StatusPill({ status }) {

function ReasonPicker({ value, onChange, compact = false, invalid = false }) {
  const known = REASONS.filter((r) => r !== "Other");
  const isOther = value !== "" && !known.includes(value);
  const selectValue = isOther ? "Other" : value;
  const selectStyle = compact
    ? { display: "block", border: `1px solid ${invalid ? C.vermilion : C.line}`, borderRadius: 5, padding: "3px 4px", fontSize: 10, width: 92, background: "#fff" }
    : { border: `1px solid ${invalid ? C.vermilion : C.line}`, borderRadius: 6, padding: "5px 6px", fontSize: 12, minWidth: 130, background: "#fff" };
  const inputStyleLocal = compact
    ? { display: "block", marginTop: 4, border: `1px solid ${C.line}`, borderRadius: 5, padding: "3px 4px", fontSize: 10, width: 92, boxSizing: "border-box" }
    : { display: "block", marginTop: 6, border: `1px solid ${C.line}`, borderRadius: 6, padding: "5px 6px", fontSize: 12, minWidth: 130, boxSizing: "border-box" };
  return (
    <>
      <select value={selectValue} onChange={(e) => onChange(e.target.value === "Other" ? "Other" : e.target.value)} style={selectStyle}>
        <option value="">{compact ? "Reason…" : "Select reason…"}</option>
        {REASONS.map((r) => <option key={r} value={r}>{r}</option>)}
      </select>
      {isOther && (
        <input type="text" placeholder="Type reason…" value={value === "Other" ? "" : value}

function Toast({ message, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2400); return () => clearTimeout(t); }, [onDone]);
  return (
    <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: C.ink, color: C.card, padding: "10px 18px", borderRadius: 10, fontSize: 13, zIndex: 50, boxShadow: "0 8px 24px rgba(27,35,64,0.3)" }} className="font-body">
      {message}
    </div>
  );
}

function App() {

  const [toast, setToast] = useState(null);

  const [form, setForm] = useState(emptyForm());

  const [reportRows, setReportRows] = useState(null);
  const [reportLoading, setReportLoading] = useState(false);
  const [shareDate, setShareDate] = useState(localDateStr());
  const [shareRecords, setShareRecords] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [uploadPreview, setUploadPreview] = useState(null);
  const [uploadGroup, setUploadGroup] = useState("4:30");
  const [uploadBusy, setUploadBusy] = useState(false);
  const [photoBusy, setPhotoBusy] = useState(false);
  const fileInputRef = useRef(null);

  function emptyForm() {
    return { name: "", profession: "Student", professionDetail: "", years: "", roundsTarget: "", group: "4:30", phone: "" };
  }

  const showToast = (m) => setToast(m);

  /* -------- load devotees on mount -------- */
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("devotees", false);
        setDevotees(res ? JSON.parse(res.value) : []);
      } catch (e) {
        setDevotees([]);
      }
      setDevoteesLoaded(true);
    })();
  }, []);

  /* -------- load month attendance whenever month changes -------- */
  useEffect(() => {
    const mk = monthKey(selectedDate);
    setAttendanceLoaded(false);
    (async () => {
      try {
        const res = await window.storage.get(`attendance:${mk}`, false);
        setMonthAttendance(res ? JSON.parse(res.value) : {});
      } catch (e) {
        setMonthAttendance({});
      }
      setAttendanceLoaded(true);
    })();
  }, [monthKey(selectedDate)]);

  /* -------- derive editable day records -------- */
  useEffect(() => {
    if (!devoteesLoaded || !attendanceLoaded) return;
    setDayRecords(defaultDayRecords(devotees, monthAttendance[selectedDate]));
  }, [devoteesLoaded, attendanceLoaded, selectedDate, monthAttendance, devotees]);

  async function persistDevotees(list) {
    setDevotees(list);
    try {
      await storageSetWithRetry("devotees", JSON.stringify(list), false);
      return true;
    } catch (e) {
      showToast(`Save failed after retries: ${e.message || "unknown error"}`);
      return false;
    }
  }

  /* -------- devotee form handlers -------- */
  function openAdd() { setForm(emptyForm()); setEditingId(null); setShowForm(true); }
  function openEdit(d) {
    setForm({ name: d.name, profession: d.profession, professionDetail: d.professionDetail || "", years: d.years, roundsTarget: d.roundsTarget, group: d.group, phone: d.phone || "" });
    setEditingId(d.id); setShowForm(true);
  }
  async function submitForm() {
    if (!form.name.trim()) { showToast("Name is required"); return; }
    let ok;
    if (editingId) {
      const updated = devotees.map((d) => d.id === editingId ? { ...d, ...form, years: Number(form.years) || 0, roundsTarget: Number(form.roundsTarget) || 0 } : d);
      ok = await persistDevotees(updated);
      if (ok) showToast("Profile updated");
    } else {
      const nextId = devotees.length ? Math.max(...devotees.map((d) => d.id)) + 1 : 1;
      const newDevotee = { id: nextId, ...form, years: Number(form.years) || 0, roundsTarget: Number(form.roundsTarget) || 0, pending: 0, log: [] };
      ok = await persistDevotees([...devotees, newDevotee]);
      if (ok) showToast("Devotee added");
    }
    if (ok) { setShowForm(false); setEditingId(null); }
  }
  async function deleteDevotee(id) {
    const ok = await persistDevotees(devotees.filter((d) => d.id !== id));
    if (ok) showToast("Devotee removed");
  }

  /* -------- attendance handlers -------- */
  function updateCheckIn(devoteeId, value) {
    setDayRecords((prev) => prev.map((r) => {
      if (r.devoteeId !== devoteeId) return r;
      const devotee = devotees.find((d) => d.id === devoteeId);
      const { status, lateBy } = computeStatus(devotee, value);
      const present = status !== "Absent";
      return {
        ...r, checkIn: value, status, lateBy, chanting: present, aarti: present, lecture: present,
        reason: status === "On time" ? "" : r.reason,
        mahamantraApplicable: status === "On time" ? true : r.mahamantraApplicable,
        chantingReason: present ? "" : r.chantingReason,
        aartiReason: present ? "" : r.aartiReason,
        lectureReason: present ? "" : r.lectureReason,
      };
    }));
  }
  function toggleSession(devoteeId, field) {
    const reasonField = field + "Reason";
    setDayRecords((prev) => prev.map((r) => {
      if (r.devoteeId !== devoteeId) return r;
      const nowPresent = !r[field];
      return { ...r, [field]: nowPresent, [reasonField]: nowPresent ? "" : r[reasonField] };
    }));
  }
  function updateReason(devoteeId, field, value) {
    setDayRecords((prev) => prev.map((r) => {
      if (r.devoteeId !== devoteeId) return r;
      const updated = { ...r, [field]: value };
      // Helpful default: health/outside reasons usually shouldn't carry a mahamantra penalty.
      const isDayReason = field === "reason";
      const isSessionReason = field === "chantingReason" || field === "aartiReason" || field === "lectureReason";
      if ((isDayReason || isSessionReason) && (value === "Health issues" || value === "Outside")) updated.mahamantraApplicable = false;
      return updated;
    }));
  }
  function toggleApplicable(devoteeId) {
    setDayRecords((prev) => prev.map((r) => r.devoteeId === devoteeId ? { ...r, mahamantraApplicable: !r.mahamantraApplicable } : r));
  }
  async function saveAttendance() {
    setSaving(true);
    const updatedDevotees = devotees.map((d) => {
      const rec = dayRecords.find((r) => r.devoteeId === d.id);
      if (!rec) return d;
      const applicable = rec.mahamantraApplicable !== false;
      const penaltyType = rec.status === "Absent" ? "absent" : rec.status === "Late" ? "late" : missedAnySession(rec) ? "missed_session" : "none";
      const { pending, log } = applyLedger(d, selectedDate, applicable, penaltyType, rec.reason);
      return { ...d, pending, log };
    });
    const updatedMonth = { ...monthAttendance, [selectedDate]: dayRecords };
    try {
      const r1 = await storageSetWithRetry(`attendance:${monthKey(selectedDate)}`, JSON.stringify(updatedMonth), false);
      const r2 = await storageSetWithRetry("devotees", JSON.stringify(updatedDevotees), false);
      setMonthAttendance(updatedMonth);
      setDevotees(updatedDevotees);
      showToast(`Attendance saved for ${prettyDate(selectedDate)}`);
    } catch (e) {
      showToast(`Save failed after retries: ${e.message || "unknown error"} — tap Save again`);
    }
    setSaving(false);

  }

  /* -------- pending submissions -------- */
  async function markSubmitted(devotee) {
    const cleared = devotee.pending;
    const updated = devotees.map((d) => d.id === devotee.id
      ? { ...d, pending: 0, log: [{ date: localDateStr(), type: "Submitted", amount: -cleared }, ...(d.log || [])] }
      : d);
    const ok = await persistDevotees(updated);
    if (ok) showToast(`Marked ${devotee.name}'s ${cleared} rounds as submitted`);
  }
  const pendingList = useMemo(() => [...devotees].filter((d) => d.pending > 0).sort((a, b) => b.pending - a.pending), [devotees]);

  /* -------- monthly report -------- */
  async function generateReport() {
    setReportLoading(true);
    let data = monthAttendance;
    if (reportMonth !== monthKey(selectedDate)) {
      try {
        const res = await window.storage.get(`attendance:${reportMonth}`, false);
        data = res ? JSON.parse(res.value) : {};
      } catch (e) { data = {}; }
    }
    const dates = Object.keys(data).sort();
    const rows = devotees.map((d) => {
      let late = 0, absent = 0;
      const cells = dates.map((dt) => {
        const rec = (data[dt] || []).find((r) => r.devoteeId === d.id);
        if (!rec) return "-";
        const exempt = rec.mahamantraApplicable === false;
        if (rec.status === "Absent") {
          absent++;
          return `A${rec.reason ? `(${reasonCode(rec.reason)})` : ""}${exempt ? " EX" : ""}`;
        }
        if (rec.status === "Late") {
          late++;
          let out = `L-${rec.lateBy}${rec.reason ? `(${reasonCode(rec.reason)})` : ""}${exempt ? " EX" : ""}`;
          return out;
        }
        // On time — check for missed sessions
        const missed = [];
        if (!rec.chanting) missed.push(`Ch${rec.chantingReason ? `:${reasonCode(rec.chantingReason)}` : ""}`);
        if (!rec.aarti) missed.push(`Ar${rec.aartiReason ? `:${reasonCode(rec.aartiReason)}` : ""}`);
        if (!rec.lecture) missed.push(`Le${rec.lectureReason ? `:${reasonCode(rec.lectureReason)}` : ""}`);
        if (missed.length) return `P [${missed.join(",")}]${exempt ? " EX" : ""}`;
        return "P";
      });
      return { devotee: d, cells, late, absent };
    });
    setReportRows({ dates, rows });
    setReportLoading(false);
  }
  function downloadExcel() {
    if (!reportRows) return;
    const header = ["Sr No", "Name", "Group", ...reportRows.dates, "Total Late", "Total Absent", "Pending (current)"];
    const aoa = [header, ...reportRows.rows.map((r) => [
      r.devotee.id, r.devotee.name, EXPECTED_LABEL[r.devotee.group] || r.devotee.group,
      ...r.cells, r.late, r.absent, r.devotee.pending,
    ])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 6 }, { wch: 18 }, { wch: 9 }, ...reportRows.dates.map(() => ({ wch: 16 })), { wch: 10 }, { wch: 12 }, { wch: 14 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, reportMonth);
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([out], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `attendance-${reportMonth}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* -------- share text -------- */
  useEffect(() => {
    (async () => {
      const mk = monthKey(shareDate);
      let data = monthAttendance;
      if (mk !== monthKey(selectedDate)) {
        try {
          const res = await window.storage.get(`attendance:${mk}`, false);
          data = res ? JSON.parse(res.value) : {};
        } catch (e) { data = {}; }
      }
      setShareRecords(data[shareDate] || null);
    })();
  }, [shareDate, monthAttendance, selectedDate]);

  const shareText = useMemo(() => {
    if (!shareRecords) return null;
    const withName = shareRecords.map((r) => ({ ...r, devotee: devotees.find((d) => d.id === r.devoteeId) })).filter((r) => r.devotee);
    const onTime = withName.filter((r) => r.status === "On time").length;
    const late = withName.filter((r) => r.status === "Late").length;
    const absent = withName.filter((r) => r.status === "Absent").length;
    const pendingToday = devotees.filter((d) => d.pending > 0);
    const missedSessions = withName.filter((r) => r.status !== "Absent" && (!r.chanting || !r.aarti || !r.lecture));

    function missedText(r) {
      const parts = [];
      if (!r.chanting) parts.push(`Chanting${r.chantingReason ? ` (${r.chantingReason})` : ""}`);
      if (!r.aarti) parts.push(`Aarti${r.aartiReason ? ` (${r.aartiReason})` : ""}`);
      if (!r.lecture) parts.push(`Lecture${r.lectureReason ? ` (${r.lectureReason})` : ""}`);
      return parts.join(", ");
    }

    const groupOrder = ["4:30", "6:00"];
    let t = `🌅 Attendance — ${prettyDate(shareDate)}\n\n`;
    t += `✅ On time: ${onTime}  ⏰ Late: ${late}  ❌ Absent: ${absent}\n`;

    groupOrder.forEach((g) => {
      const members = withName.filter((r) => r.devotee.group === g).sort((a, b) => a.devotee.name.localeCompare(b.devotee.name));
      if (!members.length) return;
      t += `\n${EXPECTED_LABEL[g]} group:\n`;
      members.forEach((r) => {
        const time = r.checkIn || "—";
        const exemptNote = r.status !== "On time" && r.mahamantraApplicable === false ? " [no mahamantra]" : "";
        const tag = r.status === "Absent"
          ? `Absent${r.reason ? ` (${r.reason})` : ""}${exemptNote}`
          : r.status === "Late"
          ? `${time}, Late ${r.lateBy} min${r.reason ? ` (${r.reason})` : ""}${exemptNote}`
          : `${time}, On time`;
        t += `- ${r.devotee.name}: ${tag}\n`;
      });
    });

    if (missedSessions.length) {
      t += `\n🙏 Missed a part of the program:\n` + missedSessions.map((r) => {
        const penaltyNote = r.mahamantraApplicable === false ? " — mahamantra exempted" : " — 54 mahamantra due";
        return `- ${r.devotee.name}: ${missedText(r)}${penaltyNote}`;
      }).join("\n") + "\n";
    }
    if (pendingToday.length) t += `\n📿 Pending mahamantra submissions: ${pendingToday.length} devotee(s)\n` + pendingToday.map((d) => `- ${d.name}: ${d.pending}`).join("\n");
    return t;
  }, [shareRecords, devotees, shareDate]);

  async function copyShareText() {
    const ok = await copyToClipboard(shareText);
    showToast(ok ? "Copied — paste it into WhatsApp" : "Auto-copy blocked — text box below is selected, use your keyboard/long-press to copy");
  }

  async function resetAll() {
    try {
      await window.storage.set("devotees", JSON.stringify([]), false);
      await window.storage.set(`attendance:${monthKey(selectedDate)}`, JSON.stringify({}), false);
      setDevotees([]); setMonthAttendance({});
      showToast("All data cleared");
    } catch (e) { showToast("Reset failed"); }
    setConfirmReset(false);
  }

  async function handleFileUpload(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploadBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const data = new Uint8Array(buf);
      const wb = XLSX.read(data, { type: "array" });
      if (!wb.SheetNames.length) throw new Error("no sheets found in file");
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
      const names = extractNames(rows);
      if (!names.length) showToast("File read OK, but no names were found in it");
      setUploadPreview(names);
    } catch (err) {
      showToast(`Could not read file: ${err.message || "unknown error"}`);
    }
    setUploadBusy(false);
    e.target.value = "";
  }
  async function handleImageUpload(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setPhotoBusy(true);
    try {
      const { base64, mediaType } = await resizeImageToBase64(file);
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: "This image shows a handwritten or printed list of people's names, such as an attendance register. Read every distinct name you can find. Respond with ONLY a JSON array of strings, like [\"Name One\",\"Name Two\"] — no numbering, no commentary, no markdown code fences." },
            ],
          }],
        }),
      });
      const data = await response.json();
      const textBlocks = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      const cleaned = textBlocks.replace(/```json|```/g, "").trim();
      let names = [];
      try { names = JSON.parse(cleaned); }
      catch (parseErr) { names = cleaned.split("\n").map((l) => l.replace(/^[-*\d.\)\s]+/, "").trim()).filter(Boolean); }
      names = names.map((n) => String(n).trim()).filter(Boolean);
      if (!names.length) showToast("No names could be read from that photo");
      setUploadPreview(names);
    } catch (err) {
      showToast(`Could not read photo: ${err.message || "unknown error"}`);
    }
    setPhotoBusy(false);
    e.target.value = "";
  }

  const [pasteText, setPasteText] = useState("");
  function parsePastedNames() {
    const names = pasteText.split(/[\n,]/).map((n) => n.trim()).filter(Boolean);
    if (!names.length) { showToast("No names detected — check formatting"); return; }
    setUploadPreview(names);
    setPasteText("");
  }

  async function confirmImport() {
    const existingLower = new Set(devotees.map((d) => d.name.trim().toLowerCase()));
    const toAdd = uploadPreview.filter((n, i) => !existingLower.has(n.trim().toLowerCase()) && uploadPreview.findIndex((x) => x.trim().toLowerCase() === n.trim().toLowerCase()) === i);
    const skipped = uploadPreview.length - toAdd.length;
    let nextId = devotees.length ? Math.max(...devotees.map((d) => d.id)) + 1 : 1;
    const newDevotees = toAdd.map((name) => ({
      id: nextId++, name, profession: "Other", professionDetail: "", years: 0, roundsTarget: 0,
      group: uploadGroup, phone: "", pending: 0, log: [],
    }));
    const ok = await persistDevotees([...devotees, ...newDevotees]);
    if (ok) {
      showToast(`Imported ${newDevotees.length} devotee(s)${skipped ? `, skipped ${skipped} duplicate(s)` : ""}`);
      setUploadPreview(null);
    }
  }

  const tabs = [
    { id: "attendance", label: "Attendance", icon: CalendarDays },
    { id: "devotees", label: "Devotees", icon: Users },
    { id: "pending", label: "Pending", icon: Sunrise },
    { id: "report", label: "Monthly report", icon: Download },
    { id: "share", label: "Share", icon: MessageCircleMore },
    { id: "backup", label: "Backup", icon: CloudUpload },
  ];

  return (
    <div className="font-body" style={{ minHeight: "100vh", background: C.sand, color: C.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        .font-display{font-family:'Fraunces',serif;}
        .font-body{font-family:'Inter',sans-serif;}
        .font-mono{font-family:'JetBrains Mono',monospace;}
        input[type=time]::-webkit-calendar-picker-indicator{opacity:0.6;}
        ::-webkit-scrollbar{height:6px;width:6px;}
        ::-webkit-scrollbar-thumb{background:${C.line};border-radius:4px;}
      `}</style>

      {/* header */}
      <div style={{ background: C.ink, color: C.card, padding: "18px 20px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, maxWidth: 1000, margin: "0 auto" }}>
          <div style={{ width: 34, height: 34, borderRadius: "50%", border: `2px solid ${C.dawn}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Sunrise size={17} color={C.dawn} />
          </div>
          <div>
            <div className="font-display" style={{ fontSize: 19, fontWeight: 600, lineHeight: 1.1 }}>Sadhana Attendance</div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", marginTop: 2 }}>Morning chanting · aarti · lecture</div>
          </div>
        </div>
      </div>

      {/* tabs */}
      <div style={{ background: C.card, borderBottom: `1px solid ${C.line}`, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", overflowX: "auto", maxWidth: 1000, margin: "0 auto" }}>
          {tabs.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                display: "flex", alignItems: "center", gap: 6, padding: "12px 16px", border: "none", background: "transparent",
                borderBottom: active ? `2px solid ${C.dawn}` : "2px solid transparent", color: active ? C.ink : C.ink60,
                fontWeight: active ? 600 : 500, fontSize: 13, whiteSpace: "nowrap", cursor: "pointer",
              }}>
                <Icon size={15} /> {t.label}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ maxWidth: 1000, margin: "0 auto", padding: "20px 16px 60px" }}>
        {!devoteesLoaded ? (
          <div style={{ display: "flex", justifyContent: "center", padding: 60, color: C.ink60 }}><Loader2 className="animate-spin" size={22} /></div>
        ) : (
          <>
            {tab === "attendance" && (
              <AttendanceTab
                devotees={devotees} selectedDate={selectedDate} setSelectedDate={setSelectedDate}
                dayRecords={dayRecords} updateCheckIn={updateCheckIn} toggleSession={toggleSession}
                updateReason={updateReason} toggleApplicable={toggleApplicable} saveAttendance={saveAttendance} saving={saving} loading={!attendanceLoaded}
              />
            )}
            {tab === "devotees" && (
              <DevoteesTab
                devotees={devotees} openAdd={openAdd} openEdit={openEdit} deleteDevotee={deleteDevotee}
                showForm={showForm} setShowForm={setShowForm} form={form} setForm={setForm}
                editingId={editingId} submitForm={submitForm}
                confirmReset={confirmReset} setConfirmReset={setConfirmReset} resetAll={resetAll}
                fileInputRef={fileInputRef} handleFileUpload={handleFileUpload} uploadBusy={uploadBusy}
                handleImageUpload={handleImageUpload} photoBusy={photoBusy}
                uploadPreview={uploadPreview} setUploadPreview={setUploadPreview}
                uploadGroup={uploadGroup} setUploadGroup={setUploadGroup} confirmImport={confirmImport}
                pasteText={pasteText} setPasteText={setPasteText} parsePastedNames={parsePastedNames}
              />
            )}
            {tab === "pending" && <PendingTab pendingList={pendingList} markSubmitted={markSubmitted} />}
            {tab === "report" && (
              <ReportTab
                reportMonth={reportMonth} setReportMonth={setReportMonth} generateReport={generateReport}
                reportRows={reportRows} reportLoading={reportLoading} downloadExcel={downloadExcel}
              />
            )}
            {tab === "share" && (
              <ShareTab shareDate={shareDate} setShareDate={setShareDate} shareText={shareText} copyShareText={copyShareText} />
            )}
            {tab === "backup" && <BackupTab devotees={devotees} showToast={showToast} />}
          </>
        )}
      </div>

      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

/* ---------------------------------------------------------
   Attendance tab
--------------------------------------------------------- */
function AttendanceTab({ devotees, selectedDate, setSelectedDate, dayRecords, updateCheckIn, toggleSession, updateReason, toggleApplicable, saveAttendance, saving, loading }) {
  if (!devotees.length) {
    return <EmptyState text="No devotees yet. Add them in the Devotees tab first." />;
  }
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div className="font-display" style={{ fontSize: 20, fontWeight: 600 }}>{prettyDate(selectedDate)}</div>
        <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)}
          style={{ border: `1px solid ${C.line}`, borderRadius: 8, padding: "7px 10px", background: C.card, fontSize: 13 }} />
      </div>

      {loading ? (
        <div style={{ color: C.ink60, padding: 20 }}>Loading…</div>
      ) : (
        <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.line}`, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 940 }}>
              <thead>
                <tr style={{ background: C.sand, textAlign: "left" }}>
                  {["Sr#", "Name", "Group", "Check-in", "Status", "Late by", "Reason", "Mahamantra", "Chant", "Aarti", "Lecture"].map((h) => (
                    <th key={h} style={{ padding: "10px 12px", fontSize: 11, textTransform: "uppercase", letterSpacing: 0.4, color: C.ink60, fontWeight: 600 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {devotees.map((d) => {
                  const rec = dayRecords.find((r) => r.devoteeId === d.id);
                  if (!rec) return null;
                  const needsReason = rec.status !== "On time" || missedAnySession(rec);
                  return (
                    <tr key={d.id} style={{ borderTop: `1px solid ${C.line}` }}>
                      <td className="font-mono" style={{ padding: "10px 12px", color: C.ink60, fontSize: 13 }}>{d.id}</td>
                      <td style={{ padding: "10px 12px", fontWeight: 500, fontSize: 14 }}>{d.name}</td>
                      <td style={{ padding: "10px 12px" }}><GroupBadge group={d.group} /></td>
                      <td style={{ padding: "10px 12px" }}>
                        <input type="time" value={rec.checkIn} onChange={(e) => updateCheckIn(d.id, e.target.value)}
                          className="font-mono" style={{ border: `1px solid ${C.line}`, borderRadius: 6, padding: "5px 6px", fontSize: 13, width: 100 }} />
                      </td>
                      <td style={{ padding: "10px 12px" }}><StatusPill status={rec.status} /></td>
                      <td className="font-mono" style={{ padding: "10px 12px", fontSize: 13, color: rec.lateBy ? C.vermilion : C.ink60 }}>
                        {rec.lateBy ? `${rec.lateBy} min` : "—"}
                      </td>
                      <td style={{ padding: "10px 12px" }}>
                        {needsReason ? (
                          <ReasonPicker value={rec.reason} onChange={(v) => updateReason(d.id, "reason", v)} invalid={!rec.reason} />
                        ) : <span style={{ color: C.ink60, fontSize: 12 }}>—</span>}
                      </td>
                      <td style={{ padding: "10px 12px" }}>
                        {needsReason ? (
                          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, cursor: "pointer", color: rec.mahamantraApplicable === false ? C.ink60 : C.ink }}>
                            <input type="checkbox" checked={rec.mahamantraApplicable !== false} onChange={() => toggleApplicable(d.id)} style={{ width: 14, height: 14 }} />
                            {rec.mahamantraApplicable === false ? "Exempted" : "Applicable"}
                          </label>
                        ) : <span style={{ color: C.ink60, fontSize: 12 }}>—</span>}
                      </td>
                      {["chanting", "aarti", "lecture"].map((f) => {
                        const reasonField = f + "Reason";
                        return (
                          <td key={f} style={{ padding: "10px 12px" }}>
                            <button onClick={() => toggleSession(d.id, f)} style={{
                              width: 24, height: 24, borderRadius: 6, border: `1px solid ${rec[f] ? C.tulsi : C.line}`,
                              background: rec[f] ? C.tulsiLight : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
                            }}>
                              {rec[f] && <Check size={14} color={C.tulsi} />}
                            </button>
                            {!rec[f] && (
                              <ReasonPicker value={rec[reasonField]} onChange={(v) => updateReason(d.id, reasonField, v)} compact invalid={!rec[reasonField]} />
                            )}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <button onClick={saveAttendance} disabled={saving || loading} style={{
        marginTop: 16, background: C.dawn, color: "#fff", border: "none", borderRadius: 10, padding: "11px 22px",
        fontWeight: 600, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 8, opacity: saving ? 0.7 : 1,
      }}>
        {saving && <Loader2 size={15} className="animate-spin" />} Save attendance
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   Devotees tab
--------------------------------------------------------- */
function DevoteesTab({ devotees, openAdd, openEdit, deleteDevotee, showForm, setShowForm, form, setForm, editingId, submitForm, confirmReset, setConfirmReset, resetAll, fileInputRef, handleFileUpload, uploadBusy, handleImageUpload, photoBusy, uploadPreview, setUploadPreview, uploadGroup, setUploadGroup, confirmImport, pasteText, setPasteText, parsePastedNames }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div className="font-display" style={{ fontSize: 20, fontWeight: 600 }}>Devotees ({devotees.length})</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input ref={fileInputRef} id="excel-upload-input" type="file" accept=".xlsx,.xls,.csv" onChange={handleFileUpload}
            style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", whiteSpace: "nowrap", border: 0 }} />
          <label htmlFor="excel-upload-input" style={{ background: "transparent", color: C.ink, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, cursor: "pointer", opacity: uploadBusy ? 0.6 : 1, pointerEvents: uploadBusy ? "none" : "auto" }}>
            {uploadBusy ? <Loader2 size={15} className="animate-spin" /> : <FileSpreadsheet size={15} />} Upload Excel
          </label>
          <input id="photo-upload-input" type="file" accept="image/*" onChange={handleImageUpload}
            style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", whiteSpace: "nowrap", border: 0 }} />
          <label htmlFor="photo-upload-input" style={{ background: "transparent", color: C.ink, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, cursor: "pointer", opacity: photoBusy ? 0.6 : 1, pointerEvents: photoBusy ? "none" : "auto" }}>
            {photoBusy ? <Loader2 size={15} className="animate-spin" /> : <Camera size={15} />} Upload Photo
          </label>
          <button onClick={openAdd} style={{ background: C.ink, color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
            <Plus size={15} /> Add devotee
          </button>
        </div>
      </div>
      {photoBusy && <div style={{ fontSize: 12, color: C.ink60, marginBottom: 12 }}>Reading names from the photo…</div>}

      {uploadPreview === null && (
        <div style={{ background: C.card, border: `1px dashed ${C.line}`, borderRadius: 12, padding: 14, marginBottom: 18 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.ink60, marginBottom: 8 }}>If the upload buttons above don't open a file picker on your device, paste names here instead (one per line, or comma-separated):</div>
          <textarea value={pasteText} onChange={(e) => setPasteText(e.target.value)} placeholder={"Rahul Sharma\nPriya Patel\nAman Gupta"}
            style={{ width: "100%", minHeight: 80, border: `1px solid ${C.line}`, borderRadius: 8, padding: 10, fontSize: 13, boxSizing: "border-box", fontFamily: "inherit" }} />
          <button onClick={parsePastedNames} disabled={!pasteText.trim()} style={{ marginTop: 8, background: C.dawn, color: "#fff", border: "none", borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", opacity: pasteText.trim() ? 1 : 0.5 }}>
            Parse names
          </button>
        </div>
      )}

      {uploadPreview !== null && (
        <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 18, marginBottom: 18 }}>
          <div style={{ fontWeight: 600, marginBottom: 4 }}>Found {uploadPreview.length} name(s)</div>
          <div style={{ fontSize: 12, color: C.ink60, marginBottom: 12 }}>Review the list, pick a default group, then import. You can edit each profile afterward.</div>
          <div style={{ maxHeight: 160, overflow: "auto", border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 12px", marginBottom: 12, fontSize: 13 }}>
            {uploadPreview.length ? uploadPreview.map((n, i) => <div key={i} style={{ padding: "3px 0" }}>{n}</div>) : <span style={{ color: C.ink60 }}>No names detected.</span>}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <label style={{ fontSize: 12, color: C.ink60, display: "flex", alignItems: "center", gap: 6 }}>
              Default group:
              <select value={uploadGroup} onChange={(e) => setUploadGroup(e.target.value)} style={{ ...inputStyle, padding: "5px 8px" }}>
                <option value="4:30">4:30 AM group</option>
                <option value="6:00">6:00 AM group</option>
              </select>
            </label>
            <button onClick={confirmImport} disabled={!uploadPreview.length} style={{ background: C.dawn, color: "#fff", border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
              Import {uploadPreview.length} devotee(s)
            </button>
            <button onClick={() => setUploadPreview(null)} style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 16px", fontSize: 13, cursor: "pointer", color: C.ink60 }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {showForm && (
        <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 18, marginBottom: 18 }}>
          <div style={{ fontWeight: 600, marginBottom: 12 }}>{editingId ? "Edit devotee" : "New devotee"}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label="Name">
              <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inputStyle} />
            </Field>
            <Field label="Group">
              <select value={form.group} onChange={(e) => setForm({ ...form, group: e.target.value })} style={inputStyle}>
                <option value="4:30">4:30 AM group</option>
                <option value="6:00">6:00 AM group</option>
              </select>
            </Field>
            <Field label="Profession">
              <select value={form.profession} onChange={(e) => setForm({ ...form, profession: e.target.value })} style={inputStyle}>
                {PROFESSIONS.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </Field>
            <Field label={PROFESSION_LABEL[form.profession]}>
              <input value={form.professionDetail} onChange={(e) => setForm({ ...form, professionDetail: e.target.value })} style={inputStyle} />
            </Field>
            <Field label="Years associated">
              <input type="number" min="0" value={form.years} onChange={(e) => setForm({ ...form, years: e.target.value })} style={inputStyle} />
            </Field>
            <Field label="Chanting rounds (target)">
              <input type="number" min="0" value={form.roundsTarget} onChange={(e) => setForm({ ...form, roundsTarget: e.target.value })} style={inputStyle} />
            </Field>
            <Field label="Phone (optional)">
              <input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} style={inputStyle} />
            </Field>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
            <button onClick={submitForm} style={{ background: C.dawn, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontWeight: 600, fontSize: 13, cursor: "pointer" }}>
              {editingId ? "Save changes" : "Add devotee"}
            </button>
            <button onClick={() => setShowForm(false)} style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 8, padding: "9px 18px", fontSize: 13, cursor: "pointer", color: C.ink60 }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {!devotees.length ? (
        <EmptyState text="No devotees added yet. Tap “Add devotee” to begin." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {devotees.map((d) => (
            <div key={d.id} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 12 }}>
              <MalaRing value={d.pending || 0} size={40} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 14 }}>{d.name} <span style={{ fontWeight: 400, color: C.ink60, fontSize: 12 }}>#{d.id}</span></div>
                <div style={{ fontSize: 12, color: C.ink60, marginTop: 2 }}>
                  {d.profession}{d.professionDetail ? ` · ${d.professionDetail}` : ""} · {d.years || 0} yrs · {d.roundsTarget || 0} rounds · <GroupBadge group={d.group} />
                </div>
              </div>
              <button onClick={() => openEdit(d)} style={iconBtn}><Pencil size={15} color={C.ink60} /></button>
              <button onClick={() => deleteDevotee(d.id)} style={iconBtn}><Trash2 size={15} color={C.vermilion} /></button>
            </div>
          ))}
        </div>
      )}

      <div style={{ marginTop: 28, paddingTop: 16, borderTop: `1px solid ${C.line}` }}>
        {!confirmReset ? (
          <button onClick={() => setConfirmReset(true)} style={{ background: "transparent", border: "none", color: C.ink60, fontSize: 12, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
            <RotateCcw size={13} /> Clear all data
          </button>
        ) : (
          <div style={{ fontSize: 13, color: C.vermilion, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            This deletes all devotees and this month's attendance. Are you sure?
            <button onClick={resetAll} style={{ background: C.vermilion, color: "#fff", border: "none", borderRadius: 6, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Yes, clear</button>
            <button onClick={() => setConfirmReset(false)} style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 6, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Cancel</button>
          </div>
        )}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return <label style={{ display: "flex", flexDirection: "column", gap: 5, fontSize: 12, color: C.ink60 }}>{label}{children}</label>;
}
const inputStyle = { border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 10px", fontSize: 13, background: "#fff", color: C.ink };
const iconBtn = { background: "transparent", border: "none", cursor: "pointer", padding: 6 };

/* ---------------------------------------------------------
   Pending submissions tab
--------------------------------------------------------- */
function PendingTab({ pendingList, markSubmitted }) {
  return (
    <div>
      <div className="font-display" style={{ fontSize: 20, fontWeight: 600, marginBottom: 6 }}>Pending mahamantra submissions</div>
      <div style={{ fontSize: 13, color: C.ink60, marginBottom: 18 }}>Late day adds 54 · absent day adds 108 · unpaid balance adds a 10-round surcharge on the next late/absent day.</div>
      {!pendingList.length ? (
        <EmptyState text="No pending submissions right now." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {pendingList.map((d) => (
            <div key={d.id} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 14 }}>
              <MalaRing value={d.pending} size={46} />
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 14 }}>{d.name}</div>
                <div style={{ fontSize: 12, color: C.ink60, marginTop: 2 }}>
                  {(d.log || []).slice(0, 3).map((l, i) => (
                    <span key={i}>{l.type} on {prettyDate(l.date)} ({l.amount > 0 ? "+" : ""}{l.amount}){i < Math.min(2, d.log.length - 1) ? " · " : ""}</span>
                  ))}
                </div>
              </div>
              <button onClick={() => markSubmitted(d)} style={{ background: C.tulsi, color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
                Mark submitted
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Monthly report tab
--------------------------------------------------------- */
function ReportTab({ reportMonth, setReportMonth, generateReport, reportRows, reportLoading, downloadExcel }) {
  return (
    <div>
      <div className="font-display" style={{ fontSize: 20, fontWeight: 600, marginBottom: 16 }}>Monthly report</div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 18 }}>
        <input type="month" value={reportMonth} onChange={(e) => setReportMonth(e.target.value)} style={{ ...inputStyle, background: C.card }} />
        <button onClick={generateReport} disabled={reportLoading} style={{ background: C.ink, color: "#fff", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          {reportLoading ? "Loading…" : "Generate"}
        </button>
        {reportRows && (
          <button onClick={downloadExcel} style={{ background: C.dawn, color: "#fff", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Download size={14} /> Download Excel
          </button>
        )}
      </div>
      <div style={{ fontSize: 11, color: C.ink60, marginBottom: 14, lineHeight: 1.6 }}>
        P = present, L = late (minutes), A = absent, Ch/Ar/Le = missed chanting/aarti/lecture, EX = mahamantra exempted.<br />
        Reason codes: H = Health issues, ST = Study, E = Exam, O = Outside, SV = Service, LN = Late night.
      </div>

      {reportRows && (
        reportRows.dates.length === 0 ? (
          <EmptyState text="No attendance recorded for this month yet." />
        ) : (
          <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "auto" }}>
            <table style={{ borderCollapse: "collapse", fontSize: 12, minWidth: 600 }}>
              <thead>
                <tr style={{ background: C.sand }}>
                  <th style={reportTh}>Name</th>
                  {reportRows.dates.map((d) => <th key={d} style={reportTh} className="font-mono">{d.slice(8)}</th>)}
                  <th style={reportTh}>Late</th>
                  <th style={reportTh}>Absent</th>
                  <th style={reportTh}>Pending</th>
                </tr>
              </thead>
              <tbody>
                {reportRows.rows.map((r) => (
                  <tr key={r.devotee.id} style={{ borderTop: `1px solid ${C.line}` }}>
                    <td style={{ ...reportTd, fontWeight: 500, whiteSpace: "nowrap" }}>{r.devotee.name}</td>
                    {r.cells.map((c, i) => (
                      <td key={i} className="font-mono" style={{ ...reportTd, color: c.startsWith("A") ? C.vermilion : c.startsWith("L") ? C.dawnDeep : c.startsWith("P") ? C.tulsi : C.ink60 }}>{c}</td>
                    ))}
                    <td style={reportTd} className="font-mono">{r.late}</td>
                    <td style={reportTd} className="font-mono">{r.absent}</td>
                    <td style={reportTd} className="font-mono">{r.devotee.pending}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )
      )}
    </div>
  );
}
const reportTh = { padding: "8px 10px", textAlign: "left", fontWeight: 600, color: C.ink60, fontSize: 11, whiteSpace: "nowrap" };
const reportTd = { padding: "7px 10px" };

/* ---------------------------------------------------------
   Share tab
--------------------------------------------------------- */
function ShareTab({ shareDate, setShareDate, shareText, copyShareText }) {
  return (
    <div>
      <div className="font-display" style={{ fontSize: 20, fontWeight: 600, marginBottom: 16 }}>Share to WhatsApp</div>
      <input type="date" value={shareDate} onChange={(e) => setShareDate(e.target.value)} style={{ ...inputStyle, background: C.card, marginBottom: 16 }} />
      {!shareText ? (
        <EmptyState text="No attendance saved for this date yet." />
      ) : (
        <>
          <textarea
            readOnly
            value={shareText}
            onFocus={(e) => e.target.select()}
            className="font-mono"
            style={{ width: "100%", background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 18, fontSize: 13, lineHeight: 1.6, minHeight: 260, resize: "vertical", boxSizing: "border-box" }}
          />
          <div style={{ fontSize: 12, color: C.ink60, marginTop: 6 }}>Tap inside the box to select all — useful if "Copy text" doesn't work in your browser.</div>
          <button onClick={copyShareText} style={{ marginTop: 10, background: C.dawn, color: "#fff", border: "none", borderRadius: 10, padding: "10px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
            <Copy size={15} /> Copy text
          </button>
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Backup tab — compiles data for a Google Drive backup.
   The artifact can't reach Google Drive directly, so this
   prepares CSV text the admin pastes to Claude in chat,
   which then saves it to Drive via the connected tool.
--------------------------------------------------------- */
function BackupTab({ devotees, showToast }) {
  const [preparing, setPreparing] = useState(false);
  const [devoteesCSV, setDevoteesCSV] = useState(null);
  const [attendanceCSV, setAttendanceCSV] = useState(null);
  const [monthsCovered, setMonthsCovered] = useState([]);

  async function prepare() {
    setPreparing(true);
    try {
      const devRows = devotees.map((d) => ({
        ID: d.id, Name: d.name, Profession: d.profession, Detail: d.professionDetail || "",
        YearsAssociated: d.years, RoundsTarget: d.roundsTarget, Group: EXPECTED_LABEL[d.group] || d.group,
        Phone: d.phone || "", PendingMahamantraRounds: d.pending || 0,
      }));
      setDevoteesCSV(toCSV(devRows));

      const listRes = await window.storage.list("attendance:", false);
      const keys = listRes && listRes.keys ? listRes.keys : [];
      const months = keys.sort();
      const attRows = [];
      for (const key of months) {
        try {
          const res = await window.storage.get(key, false);
          const monthData = res ? JSON.parse(res.value) : {};
          Object.keys(monthData).sort().forEach((date) => {
            monthData[date].forEach((rec) => {
              const dev = devotees.find((d) => d.id === rec.devoteeId);
              attRows.push({
                Date: date, Name: dev ? dev.name : `#${rec.devoteeId}`, CheckIn: rec.checkIn || "",
                Status: rec.status, LateByMinutes: rec.lateBy || 0, Reason: rec.reason || "",
                MahamantraApplicable: rec.status === "On time" ? "" : (rec.mahamantraApplicable === false ? "No" : "Yes"),
                Chanting: rec.chanting ? "Y" : "N", ChantingReason: rec.chantingReason || "",
                Aarti: rec.aarti ? "Y" : "N", AartiReason: rec.aartiReason || "",
                Lecture: rec.lecture ? "Y" : "N", LectureReason: rec.lectureReason || "",
              });
            });
          });
        } catch (e) { /* skip unreadable month */ }
      }
      setAttendanceCSV(toCSV(attRows));
      setMonthsCovered(months.map((k) => k.replace("attendance:", "")));
    } catch (e) {
      showToast("Could not gather backup data");
    }
    setPreparing(false);
  }

  async function copy(text, label) {
    const ok = await copyToClipboard(text);
    showToast(ok ? `${label} copied` : "Auto-copy blocked — tap the box and select all manually");
  }

  return (
    <div>
      <div className="font-display" style={{ fontSize: 20, fontWeight: 600, marginBottom: 6 }}>Back up to Google Drive</div>
      <div style={{ fontSize: 13, color: C.ink60, marginBottom: 18, lineHeight: 1.5 }}>
        This app can't write to Google Drive directly. Tap "Prepare backup" below, then copy each block and paste it
        to Claude in this chat with a note like "save this backup to Drive" — Claude will create the files for you.
      </div>

      <button onClick={prepare} disabled={preparing} style={{ background: C.ink, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
        {preparing && <Loader2 size={14} className="animate-spin" />} Prepare backup
      </button>

      {devoteesCSV !== null && (
        <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 20 }}>
          <div style={{ fontSize: 12, color: C.ink60 }}>
            Covers {devotees.length} devotee profile(s) and attendance from {monthsCovered.length} month(s){monthsCovered.length ? `: ${monthsCovered.join(", ")}` : ""}.
          </div>

          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontWeight: 600, fontSize: 14 }}>Devotee profiles</div>
              <button onClick={() => copy(devoteesCSV, "Devotee profiles")} style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                <Copy size={12} /> Copy
              </button>
            </div>
            <pre className="font-mono" style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, fontSize: 11, maxHeight: 160, overflow: "auto", whiteSpace: "pre" }}>{devoteesCSV || "No devotees yet."}</pre>
          </div>

          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontWeight: 600, fontSize: 14 }}>Attendance history</div>
              <button onClick={() => copy(attendanceCSV, "Attendance history")} style={{ background: "transparent", border: `1px solid ${C.line}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                <Copy size={12} /> Copy
              </button>
            </div>
            <pre className="font-mono" style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, fontSize: 11, maxHeight: 220, overflow: "auto", whiteSpace: "pre" }}>{attendanceCSV || "No attendance recorded yet."}</pre>
          </div>
        </div>
      )}
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div style={{ textAlign: "center", padding: "50px 20px", color: C.ink60, background: C.card, border: `1px dashed ${C.line}`, borderRadius: 14, fontSize: 13 }}>
      {text}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
